version: 1
# Bootstrap has no model, inference, or action authority.
model_dir: ""
inference_url: ""
baseline_file: /etc/secure-ai/gpu-integrity/bootstrap-baseline.yaml
probes:
  # First appliance target: RTX 5080 reports ECC telemetry unavailable.
  # Never convert unavailable counters into healthy ECC evidence. A release
  # for ECC-capable hardware must explicitly enable and require this probe.
  - name: ecc-status
    type: ecc_status
    enabled: false
  - name: driver-fingerprint
    type: driver_fingerprint
    enabled: true
    settings:
      driver_version_path: /sys/module/nvidia/version
      kernel_module: nvidia
  - name: device-allowlist
    type: device_allowlist
    enabled: true
scoring:
  weights:
    ecc_status: 0.6
    driver_fingerprint: 1.0
    device_allowlist: 0.8
  max_history: 20
actions: []
daemon:
  bind_addr: 127.0.0.1:8492
  interval: 30s
integrations: {}
