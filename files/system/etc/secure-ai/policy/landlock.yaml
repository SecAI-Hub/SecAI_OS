# Landlock LSM Filesystem Access Policies
#
# Per-service filesystem access allowlists. Each service is restricted to
# only the paths listed here. Access types:
#   ro  = read-only (LANDLOCK_ACCESS_FS_READ_FILE + READ_DIR)
#   rw  = read-write (all read + WRITE_FILE + REMOVE_FILE + MAKE_REG + MAKE_DIR)
#   exe = execute (LANDLOCK_ACCESS_FS_EXECUTE)
#
# These policies are applied by the landlock-apply helper at service start.
# Native production units invoke the helper with --require and fail closed if
# the kernel cannot enforce Landlock. Explicit development invocations may omit
# --require to inspect policy behavior on unsupported hosts.

version: 1

common_paths:
  - path: /run/credentials
    access: ro

services:
  inference:
    description: "Inference worker — read-only model access, no output writes"
    paths:
      - path: /var/lib/secure-ai/vault/models
        access: ro
        required: true
      - path: /etc/secure-ai
        access: ro
        required: true
      # start-inference.sh resolves and re-hashes the manifest-bound model
      # before the Landlock boundary is applied.  The confined watchdog needs
      # only these immutable helpers and their runtime libraries.
      - path: /usr/libexec/secure-ai/inference-wrapper.sh
        access: exe
        required: true
      - path: /usr/bin/llama-server
        access: exe
        required: true
      - path: /usr/bin/bash
        access: exe
        required: true
      - path: /usr/bin/env
        access: exe
        required: true
      - path: /usr/bin/curl
        access: exe
        required: true
      - path: /usr/bin/systemd-notify
        access: exe
        required: true
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /dev
        access: rw
        # The systemd DevicePolicy remains the authoritative GPU-device
        # allowlist. Landlock must permit ioctl access to devices that survive
        # that cgroup boundary, especially with ABI v5.
      - path: /tmp
        access: rw

  diffusion:
    description: "Diffusion worker — model read, output write"
    paths:
      - path: /var/lib/secure-ai/vault/models
        access: ro
        required: true
      - path: /var/lib/secure-ai/vault/outputs
        access: rw
        required: true
      - path: /var/lib/secure-ai/diffusion-venv
        access: exe
        required: true
      - path: /etc/secure-ai
        access: ro
        required: true
      - path: /usr/bin/python3
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /opt/secure-ai/services
        access: ro
        required: true
      - path: /proc
        access: ro
      - path: /sys
        access: ro
      - path: /dev
        access: rw
        # DevicePolicy/DeviceAllow in the unit narrows this broad path to the
        # selected GPU device nodes.
      - path: /tmp
        access: rw

  registry:
    description: "Trusted registry — manifest + model store read-write, config read-only"
    paths:
      - path: /var/lib/secure-ai/registry
        access: rw
      - path: /var/lib/secure-ai/vault/models
        access: rw
      - path: /var/lib/secure-ai/vault/contained-models
        access: rw
      - path: /var/lib/secure-ai/promotion-staging
        access: rw
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/registry
        access: exe
      - path: /usr/local/bin/gguf-guard
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  ui:
    description: "Web UI — incoming model handoff only, auth/UI state, logs, config"
    paths:
      - path: /var/lib/secure-ai/quarantine/incoming
        access: rw
      - path: /var/lib/secure-ai/auth
        access: rw
      - path: /var/lib/secure-ai/ui
        access: rw
        required: true
      - path: /var/lib/secure-ai/import-staging
        access: ro
        required: true
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /run/secure-ai
        access: rw
      - path: /run/secure-ai-ui
        access: rw
        required: true
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/ui
        access: exe
      - path: /usr/lib/secure-ai/python3.12-venv
        access: exe
        required: true
      - path: /usr/bin/env
        access: exe
      - path: /usr/bin/bash
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /opt/secure-ai/services
        access: ro
      - path: /tmp
        access: rw

  tool_firewall:
    description: "Tool firewall — policy read, vault read-only, audit log write"
    paths:
      - path: /var/lib/secure-ai/vault
        access: ro
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/tool-firewall
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  quarantine:
    description: "Quarantine watcher — untrusted input + promotion staging only"
    paths:
      - path: /var/lib/secure-ai/quarantine/incoming
        access: rw
      - path: /var/lib/secure-ai/quarantine/processing
        access: rw
        required: true
      - path: /var/lib/secure-ai/promotion-staging
        access: rw
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/landlock-apply.py
        access: exe
        required: true
      - path: /usr/libexec/secure-ai/quarantine-scanner
        access: exe
        required: true
      - path: /usr/bin/bwrap
        access: exe
        required: true
      - path: /usr/bin/env
        access: exe
        required: true
      - path: /usr/bin/llama-server
        access: exe
      - path: /usr/bin/sha256sum
        access: exe
      - path: /usr/bin/cosign
        access: exe
      # Scanner entry points and their exact CPython interpreter live in the
      # immutable, release-measured application runtime.
      - path: /usr/lib/secure-ai/python3.12-venv
        access: exe
        required: true
      - path: /usr/local/bin
        access: exe
        required: true
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /opt/secure-ai/services
        access: ro
        required: true
      - path: /proc
        access: ro
      - path: /dev/null
        access: rw
      - path: /dev/urandom
        access: ro
      - path: /tmp
        access: rw

  quarantine_scanner:
    description: "Credentialless parser worker — private claimed snapshot read-only, no promotion/log/credential access"
    include_common_paths: false
    paths:
      - path: /var/lib/secure-ai/quarantine/processing
        access: ro
        required: true
      - path: /etc/secure-ai
        access: ro
        required: true
      - path: /usr/libexec/secure-ai/quarantine-scanner
        access: exe
        required: true
      - path: /usr/bin/env
        access: exe
        required: true
      - path: /usr/bin/llama-server
        access: exe
        required: true
      - path: /usr/bin/sha256sum
        access: exe
      - path: /usr/bin/cosign
        access: exe
      - path: /usr/local/bin
        access: exe
        required: true
      - path: /usr/lib/secure-ai/python3.12-venv
        access: exe
        required: true
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /opt/secure-ai/services
        access: ro
        required: true
      - path: /proc
        access: ro
      - path: /dev/null
        access: rw
      - path: /dev/urandom
        access: ro
      - path: /tmp
        access: rw

  airlock:
    description: "Airlock — policy read, logs write, outbound network (not restricted by Landlock)"
    paths:
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /var/lib/secure-ai/airlock
        access: rw
      - path: /etc/secure-ai
        access: ro
        required: true
      # TLS verification and hostname resolution happen after the policy is
      # installed. Omitting these Fedora trust inputs makes HTTPS fail closed
      # for every allowed destination.
      - path: /etc/pki
        access: ro
        required: true
      - path: /etc/resolv.conf
        access: ro
        required: true
      - path: /etc/hosts
        access: ro
        required: true
      - path: /etc/nsswitch.conf
        access: ro
        required: true
      - path: /etc/gai.conf
        access: ro
      - path: /etc/localtime
        access: ro
      - path: /usr/libexec/secure-ai/airlock
        access: exe
        required: true
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /dev/urandom
        access: ro
      - path: /tmp
        access: rw

  search_mediator:
    description: "Search mediator — config read, logs write"
    paths:
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/search-mediator
        access: exe
        required: true
      - path: /usr/bin/env
        access: exe
        required: true
      - path: /usr/bin/bash
        access: exe
        required: true
      - path: /usr/lib/secure-ai/python3.12-venv
        access: exe
        required: true
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /opt/secure-ai/services
        access: ro
        required: true
      - path: /tmp
        access: rw

  gpu_integrity_watch:
    description: "GPU integrity watch — GPU sysfs read, baseline rw, logs write, inference probe"
    paths:
      - path: /var/lib/secure-ai/gpu-integrity
        access: rw
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /var/lib/secure-ai/vault/models
        access: ro
      - path: /etc/secure-ai
        access: ro
      - path: /sys/class/drm
        access: ro
      - path: /sys/bus/pci/devices
        access: ro
      - path: /sys/module
        access: ro
      - path: /dev
        access: rw
        # The unit's DevicePolicy permits only GPU nodes.
      - path: /usr/bin/nvidia-smi
        access: exe
      - path: /usr/bin/rocm-smi
        access: exe
      - path: /usr/libexec/secure-ai/gpu-integrity-watch
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  mcp_firewall:
    description: "MCP firewall — policy read, vault read-only, audit log write"
    paths:
      - path: /var/lib/secure-ai/vault
        access: ro
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/mcp-firewall
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  integrity_monitor:
    description: "Integrity monitor — reads binaries, policies, models, systemd units; writes audit logs"
    paths:
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /var/lib/secure-ai/integrity
        access: rw
      - path: /var/lib/secure-ai/registry
        access: ro
      - path: /var/lib/secure-ai/vault/models
        access: ro
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/integrity-monitor
        access: exe
      - path: /usr/lib/systemd/system
        access: ro
        required: true
      - path: /usr/share/secure-ai/integrity
        access: ro
        required: true
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  runtime_attestor:
    description: "Runtime attestor — reads binaries, policies, EFI vars, TPM; writes audit logs"
    paths:
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /var/lib/secure-ai/registry
        access: ro
      - path: /etc/secure-ai
        access: ro
      - path: /sys/firmware/efi
        access: ro
      - path: /sys/kernel/security
        access: ro
      - path: /proc/cmdline
        access: ro
      - path: /dev/tpmrm0
        access: rw
      - path: /dev/tpm0
        access: rw
      - path: /usr/libexec/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/runtime-attestor
        access: exe
      - path: /usr/bin/tpm2_pcrread
        access: exe
      - path: /usr/bin/tpm2_quote
        access: exe
      - path: /usr/bin/tpm2_checkquote
        access: exe
      - path: /usr/bin/rpm-ostree
        access: exe
      - path: /usr/share/secure-ai/integrity
        access: ro
        required: true
      - path: /var/lib/rpm-ostree
        access: ro
      - path: /sysroot/ostree
        access: ro
      - path: /run/dbus
        access: ro
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  policy_engine:
    description: "Policy engine — policy read, audit log write, no vault or device access"
    paths:
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /usr/libexec/secure-ai/policy-engine
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw

  incident_recorder:
    description: "Incident recorder — containment policy read, audit log write"
    paths:
      - path: /var/lib/secure-ai/logs
        access: rw
      - path: /var/lib/secure-ai/data
        access: rw
      - path: /etc/secure-ai
        access: ro
      - path: /run/secure-ai
        access: ro
      - path: /run/secure-ai/vault-control/requests
        access: rw
      - path: /run/secure-ai/vault-control/results
        access: ro
      - path: /usr/libexec/secure-ai/incident-recorder
        access: exe
      - path: /usr/lib
        access: ro
      - path: /usr/lib64
        access: ro
      - path: /tmp
        access: rw
