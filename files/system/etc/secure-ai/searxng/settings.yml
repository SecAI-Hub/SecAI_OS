# Secure AI Appliance - SearXNG Configuration
# Self-hosted metasearch engine. All outbound requests route through Tor.
# Listens on localhost only — accessed by the search mediator service.

# The application needs defaults beyond its schema (for example DOI resolvers).
# Keep the explicitly reviewed engine set while inheriting the pinned defaults.
use_default_settings:
  engines:
    keep_only: [duckduckgo, wikipedia, wikidata, stackoverflow, github, arch wiki]

general:
  instance_name: "SecAI Search"
  debug: false
  enable_metrics: false

server:
  bind_address: "127.0.0.1"
  port: 8888
  # start-searxng.sh fails closed unless it can replace this public marker in
  # an owner-only, ephemeral /run settings file from the systemd credential.
  secret_key: "required-runtime-credential"
  # No public access — localhost only
  limiter: false
  # Disable public image proxy (no need, we strip images)
  image_proxy: false

search:
  safe_search: 1
  default_lang: "en"
  autocomplete: ""
  # Explicit API contract; do not inherit changing upstream format defaults.
  formats: [html, json]

# Route ALL outbound requests through Tor SOCKS5 proxy
outgoing:
  proxies:
    all://:
      - socks5h://127.0.0.1:9050
  using_tor_proxy: true
  extra_proxy_timeout: 10
  # Timeout per engine request (Tor adds latency)
  request_timeout: 20
  useragent_suffix: ""

# Only enable privacy-respecting search engines
engines:
  # Web search
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    # The mediator consumes the JSON results array, not infoboxes.
    display_type: [list]

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false

  # Programming / technical
  - name: stackoverflow
    engine: stackexchange
    shortcut: so
    api_site: stackoverflow
    categories: [it, q&a]
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: arch wiki
    engine: archlinux
    shortcut: aw
    disabled: false

# Disable analytics, tracking, result collection
ui:
  default_theme: simple
  results_on_new_tab: false

# Only these built-in plugins load. Tracker-list downloads at startup are
# disabled; the mediator strips common tracking parameters using local rules.
plugins:
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
