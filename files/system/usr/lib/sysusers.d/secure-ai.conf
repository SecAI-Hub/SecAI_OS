# Resource-specific groups for DynamicUser= services.  Authentication secrets
# are deliberately not group-readable; systemd delivers those as credentials.
g secure-ai-services -
g secure-ai-registry -
g secure-ai-registry-containment -
g secure-ai-quarantine -
g secure-ai-promotion -
g secure-ai-logs -
g secure-ai-data -
g secure-ai-auth -
g secure-ai-agent-ipc -
g secure-ai-integrity -
g secure-ai-gpu-integrity -
g secure-ai-model-read -
g secure-ai-import -
g secure-ai-ui-state -
g secure-ai-ui-control -
g secure-ai-tor -
u secure-ai-tor - "Secure AI Tor proxy" /var/lib/secure-ai/tor -
g secure-ai-vault-read -
g secure-ai-vault-write -
g secure-ai-vault-control -
g secure-ai-airlock-state -
g secure-ai-agent-state -
# Stable ownership is needed for the mode-0600 MCP recovery journal.
u secure-ai-mcp - "Secure AI MCP gateway" /var/lib/secure-ai -
u secure-ai-search - "Secure AI search mediator" /var/lib/secure-ai -

# Stable owners preserve private single-writer durable audit streams across restarts.
u secure-ai-airlock - "Secure AI airlock" /var/lib/secure-ai -
u secure-ai-policy-engine - "Secure AI policy engine" /var/lib/secure-ai -
