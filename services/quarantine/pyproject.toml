[project]
name = "secure-ai-quarantine"
version = "0.1.0"
description = "Quarantine pipeline: verify, scan, smoke-test, and promote model artifacts"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests==2.34.2",
    "watchdog>=4.0",
    "yara-python==4.5.4",
    "pip==26.2.1",
    "setuptools==84.1.0",
    "wheel==0.48.0",
]

[project.optional-dependencies]
scan = [
    "modelscan==0.8.8",
    "fickling==0.1.12",
    "modelaudit==0.2.52",
]
garak = [
    "garak==0.16.0",
]

[project.scripts]
secure-ai-quarantine = "quarantine.watcher:main"

[tool.setuptools.package-data]
quarantine = ["yara_rules/*.yar"]
