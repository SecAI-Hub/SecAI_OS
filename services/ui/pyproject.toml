[project]
name = "secure-ai-ui"
version = "0.1.0"
description = "Secure AI Appliance local web UI"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "gunicorn==26.2.0",
    "pip==26.2.1",
    "setuptools==84.1.0",
    "wheel==0.48.0",
]

[project.scripts]
secure-ai-ui = "ui.app:main"

[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ui"]
include-package-data = false

[tool.setuptools.package-data]
ui = ["templates/*.html", "static/*", "static/**/*"]
