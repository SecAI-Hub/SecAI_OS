version: 1

# Directory containing model weight files to monitor.
model_dir: /var/lib/secure-ai/vault/models

# Bounded authenticated fixed-reference probe adapter; never llama-server directly.
inference_url: "http://127.0.0.1:8497"

# Reviewed protected baseline; approval pins are in measured attestation policy.
baseline_file: /etc/secure-ai/gpu-integrity/runtime-baseline.yaml

# Probe configuration — probes run in order listed.
probes:
  - name: tensor-hash-check
    type: tensor_hash
    enabled: true
    settings:
      patterns: "*.gguf,*.bin,*.safetensors"

  - name: sentinel-inference
    type: sentinel_inference
    enabled: true
    settings:
      similarity_threshold: "0.85"

  - name: reference-drift
    type: reference_drift
    enabled: false           # enable after establishing baseline
    settings:
      iterations: "3"

  # First appliance target: RTX 5080 reports ECC telemetry unavailable.
  # Never convert unavailable counters into healthy ECC evidence. A release
  # for ECC-capable hardware must explicitly enable and require this probe.
  - name: ecc-status
    type: ecc_status
    enabled: false

  - name: driver-fingerprint
    type: driver_fingerprint
    enabled: true
    settings:
      driver_version_path: /sys/module/nvidia/version
      kernel_module: nvidia

  - name: device-allowlist
    type: device_allowlist
    enabled: true
    # settings:
    #   device_dir: /dev/dri

# Scoring weights (higher = more impact on composite score).
scoring:
  weights:
    tensor_hash: 1.0
    sentinel_inference: 1.0
    reference_drift: 0.8
    ecc_status: 0.6
    driver_fingerprint: 1.0
    device_allowlist: 0.8
  max_history: 200

# Observation alerts only. Runtime admission blocks failed evidence; the
# authenticated incident recorder owns containment. The probe adapter has no
# reload, shutdown, file, model-selection or slot-management actions.
actions:
  - name: alert-warning
    type: alert
    trigger: warning

  # Registry quarantine is performed by the authenticated incident-recorder
  # containment path. This unprivileged observer deliberately has no write
  # access to the trusted model directory.
  - name: report-critical
    type: alert
    trigger: critical

# Daemon settings.
daemon:
  bind_addr: "127.0.0.1:8495"
  interval: "5m"

# Integration with other SecAI services.
integrations:
  incident_recorder_url: "http://127.0.0.1:8515"
  runtime_attestor_url: "http://127.0.0.1:8505"
